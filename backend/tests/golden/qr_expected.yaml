# Golden test set for QR Code & UPI Detection Engine (ARCHITECTURE Section 8.8 & BUILD_PLAN Chunk 9)
cases:
  - id: 1
    name: "genuine_merchant_upi"
    filename: "genuine_merchant_upi.png"
    type: "safe"
    payload_type: "upi"
    payload: "upi://pay?pa=swiggy@icici&pn=Swiggy&am=349.00&cu=INR&tn=Order%20SW109283"
    expected_level:
      - "likely_safe"
    description: "Genuine verified merchant UPI transaction for food delivery order"

  - id: 2
    name: "fake_reward_upi"
    filename: "fake_reward_upi.png"
    type: "scam"
    payload_type: "upi"
    payload: "upi://pay?pa=reward.claim99@ybl&pn=PhonePe%20Reward&am=500.00&cu=INR&tn=Scan%20to%20receive%20Rs%20500%20reward"
    expected_level:
      - "high"
      - "critical"
    description: "Fake claim ₹500 reward UPI QR with pre-filled amount and personal VPA"

  - id: 3
    name: "deceptive_url_qr"
    filename: "deceptive_url_qr.png"
    type: "scam"
    payload_type: "url"
    payload: "http://sbi-kyc-update.xyz/login"
    expected_level:
      - "high"
      - "critical"
    description: "Phishing QR destination targeting SBI KYC credentials on suspicious .xyz domain"

  - id: 4
    name: "plain_text_qr"
    filename: "plain_text_qr.png"
    type: "safe"
    payload_type: "text"
    payload: "Garuda defense platform engine test meeting at 4 PM"
    expected_level:
      - "likely_safe"
    description: "Plain benign text message encoded in QR code"

  - id: 5
    name: "wifi_config_qr"
    filename: "wifi_config_qr.png"
    type: "safe"
    payload_type: "wifi"
    payload: "WIFI:S:GarudaSecureWiFi;T:WPA;P:SuperSecretPass2026;;"
    expected_level:
      - "likely_safe"
    description: "Standard local Wi-Fi wireless network credentials QR code"

  - id: 6
    name: "fake_electricity_threat_upi"
    filename: "fake_electricity_threat_upi.png"
    type: "scam"
    payload_type: "upi"
    payload: "upi://pay?pa=electricity.officer88@okhdfc&pn=Electricity%20Department&am=1450.00&cu=INR&tn=Pay%20now%20or%20power%20will%20be%20disconnected%20tonight"
    expected_level:
      - "high"
      - "critical"
    description: "Utility impersonation with personal handle and disconnection threat note"

  - id: 7
    name: "scan_to_receive_cashback_upi"
    filename: "scan_to_receive_cashback_upi.png"
    type: "scam"
    payload_type: "upi"
    payload: "upi://pay?pa=cashback.helpdesk@paytm&pn=Google%20Pay%20Cashback&am=2000.00&cu=INR&tn=Scan%20to%20receive%20cashback%20enter%20UPI%20PIN"
    expected_level:
      - "high"
      - "critical"
    description: "Scan to receive cashback trap asking victim to enter PIN to collect"
